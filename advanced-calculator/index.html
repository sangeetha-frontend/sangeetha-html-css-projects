<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Calculator | Sangeetha</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .calculator {
      width: 100%;
      max-width: 360px;
      padding: 22px;
      border-radius: 22px;
      background: #1e2030;
      box-shadow: 0 20px 50px #0004;
    }

    h1 {
      color: white;
      font-size: 21px;
      text-align: center;
      margin: 0 0 18px;
    }

    #display {
      width: 100%;
      height: 85px;
      padding: 16px;
      margin-bottom: 18px;
      border: 0;
      border-radius: 12px;
      background: #303347;
      color: white;
      font-size: 32px;
      text-align: right;
      outline: none;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
    }

    button {
      min-height: 56px;
      border: 0;
      border-radius: 12px;
      font-size: 19px;
      font-weight: 600;
      background: #36394e;
      color: white;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.2); }
    button:active { transform: scale(.97); }
    .utility { background: #515570; }
    .operator { background: #7161df; }
    .equals { background: #f2a93b; color: #242030; }
    .zero { grid-column: span 2; }

    #message {
      min-height: 18px;
      color: #ffcc77;
      font-size: 13px;
      text-align: center;
      margin: 12px 0 0;
    }
  </style>
</head>
<body>
  <main class="calculator">
    <h1>✨ Advanced Calculator</h1>

    <input id="display" type="text" value="0"
           aria-label="Calculator display" readonly>

    <div class="buttons">
      <button class="utility" data-action="clear">AC</button>
      <button class="utility" data-action="delete">DEL</button>
      <button class="utility" data-value="%">%</button>
      <button class="operator" data-value="÷">÷</button>

      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="×">×</button>

      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="-">−</button>

      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button class="operator" data-value="+">+</button>

      <button class="zero" data-value="0">0</button>
      <button data-value=".">.</button>
      <button class="equals" data-action="equals">=</button>
    </div>

    <p id="message" aria-live="polite"></p>
  </main>

  <script>
    const display = document.getElementById("display");
    const message = document.getElementById("message");
    let expression = "";
    let finished = false;

    function show() {
      display.value = expression || "0";
    }

    function clearAll() {
      expression = "";
      finished = false;
      message.textContent = "";
      show();
    }

    function calculate() {
      if (!expression) return;

      try {
        let input = expression.replace(/×/g, "*")
                              .replace(/÷/g, "/");

        if (!/^[0-9+\-*/%.()\s]+$/.test(input)) {
          throw new Error("Invalid expression");
        }

        // Evaluate only the calculator's validated arithmetic expression.
        const result = Function('"use strict"; return (' + input + ')')();

        if (typeof result !== "number" || !Number.isFinite(result)) {
          throw new Error("Invalid result");
        }

        expression = String(Number(result.toPrecision(12)));
        finished = true;
        message.textContent = "";
        show();
      } catch {
        message.textContent = "Invalid calculation. Press AC to restart.";
      }
    }

    document.querySelector(".buttons").addEventListener("click", event => {
      const button = event.target.closest("button");
      if (!button) return;

      const value = button.dataset.value;
      const action = button.dataset.action;
      message.textContent = "";

      if (action === "clear") {
        clearAll();
        return;
      }

      if (action === "delete") {
        expression = expression.slice(0, -1);
        finished = false;
        show();
        return;
      }

      if (action === "equals") {
        calculate();
        return;
      }

      if (value === "%") {
        const match = expression.match(/(\d+\.?\d*)$/);
        if (match) {
          const number = Number(match[0]) / 100;
          expression = expression.slice(0, -match[0].length) + number;
          finished = false;
          show();
        }
        return;
      }

      if (!value) return;

      if (finished && /[0-9.]/.test(value)) {
        expression = "";
      }
      finished = false;

      const operators = ["+", "-", "×", "÷"];

      if (operators.includes(value)) {
        if (!expression && value !== "-") return;

        if (operators.includes(expression.slice(-1))) {
          expression = expression.slice(0, -1);
        }
        expression += value;
      } else if (value === ".") {
        const currentNumber = expression.split(/[+\-×÷]/).pop();
        if (currentNumber.includes(".")) return;
        expression += currentNumber ? "." : "0.";
      } else {
        expression += value;
      }

      show();
    });
  </script>
</body>
</html>
