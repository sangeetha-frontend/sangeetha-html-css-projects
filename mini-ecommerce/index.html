<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini Store | Sangeetha</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f6fa;
      color: #25253a;
    }

    header {
      background: #24243e;
      color: white;
      padding: 22px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    header h1 { margin: 0; font-size: 25px; }
    header span { color: #f8ce6b; }

    .hero {
      text-align: center;
      padding: 45px 20px;
      background: linear-gradient(135deg, #dedbff, #fce8f1);
    }

    .hero h2 { font-size: clamp(28px, 5vw, 42px); margin: 0 0 12px; }
    .hero p { color: #555; }

    .container { max-width: 1100px; margin: auto; padding: 30px 20px; }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    select, button {
      font: inherit;
      padding: 10px 14px;
      border-radius: 8px;
    }

    select { border: 1px solid #ddd; background: white; }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 22px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 15px;
      box-shadow: 0 5px 20px #25253a0c;
    }

    .product-image {
      height: 150px;
      display: grid;
      place-items: center;
      font-size: 75px;
      background: #f1efff;
      border-radius: 12px;
    }

    .card h3 { margin-bottom: 8px; }
    .price { font-weight: bold; font-size: 20px; color: #6657d9; }

    button {
      border: 0;
      cursor: pointer;
      background: #6657d9;
      color: white;
    }

    button:hover { opacity: .86; }
    .add-btn { width: 100%; margin-top: 8px; }

    .cart {
      margin-top: 35px;
      background: white;
      padding: 22px;
      border-radius: 15px;
    }

    .cart-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid #eee;
    }

    .cart-row span { overflow-wrap: anywhere; }
    .remove-btn { background: #e84d5b; padding: 7px 10px; }
    .checkout { margin-top: 15px; }

    #message { color: #23834b; min-height: 20px; }
    footer { text-align: center; padding: 24px; color: #777; }

    @media (max-width: 480px) {
      header { padding: 18px; }
      .cart-row { flex-wrap: wrap; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Mini<span>Store.</span></h1>
    <strong>🛒 Cart: <span id="cartCount">0</span></strong>
  </header>

  <section class="hero">
    <h2>Find Your Favorites ✨</h2>
    <p>Simple products. Lovely prices. Easy shopping.</p>
  </section>

  <main class="container">
    <div class="toolbar">
      <h2>Our Products</h2>
      <label>
        Sort:
        <select id="sort">
          <option value="default">Featured</option>
          <option value="low">Price: Low to High</option>
          <option value="high">Price: High to Low</option>
        </select>
      </label>
    </div>

    <section class="products" id="products"></section>

    <section class="cart">
      <h2>Your Shopping Cart 🛍️</h2>
      <div id="cartItems"></div>
      <h3>Total: ₹<span id="total">0</span></h3>
      <button class="checkout" id="checkout">Place Demo Order</button>
      <p id="message" aria-live="polite"></p>
      <small>This is a demo store. No real payment or order is processed.</small>
    </section>
  </main>

  <footer>Designed by Sangeetha | Mini E-commerce Project</footer>

  <script>
    const products = [
      { id: 1, name: "Wireless Headphones", price: 1499, emoji: "🎧" },
      { id: 2, name: "Smart Watch", price: 1999, emoji: "⌚" },
      { id: 3, name: "Casual Backpack", price: 899, emoji: "🎒" },
      { id: 4, name: "Running Shoes", price: 1799, emoji: "👟" },
      { id: 5, name: "Sunglasses", price: 599, emoji: "🕶️" },
      { id: 6, name: "Coffee Mug", price: 299, emoji: "☕" }
    ];

    let cart = [];

    const productsEl = document.getElementById("products");
    const cartItemsEl = document.getElementById("cartItems");
    const totalEl = document.getElementById("total");
    const cartCountEl = document.getElementById("cartCount");
    const messageEl = document.getElementById("message");

    function renderProducts() {
      let items = [...products];
      const sort = document.getElementById("sort").value;

      if (sort === "low") items.sort((a, b) => a.price - b.price);
      if (sort === "high") items.sort((a, b) => b.price - a.price);

      productsEl.replaceChildren();

      items.forEach(product => {
        const card = document.createElement("article");
        card.className = "card";

        const image = document.createElement("div");
        image.className = "product-image";
        image.textContent = product.emoji;
        image.setAttribute("aria-hidden", "true");

        const name = document.createElement("h3");
        name.textContent = product.name;

        const price = document.createElement("p");
        price.className = "price";
        price.textContent = "₹" + product.price.toLocaleString("en-IN");

        const button = document.createElement("button");
        button.className = "add-btn";
        button.textContent = "Add to Cart +";
        button.addEventListener("click", () => addToCart(product.id));

        card.append(image, name, price, button);
        productsEl.appendChild(card);
      });
    }

    function addToCart(id) {
      const existing = cart.find(item => item.id === id);

      if (existing) {
        existing.quantity++;
      } else {
        const product = products.find(item => item.id === id);
        cart.push({ ...product, quantity: 1 });
      }

      messageEl.textContent = "";
      renderCart();
    }

    function renderCart() {
      cartItemsEl.replaceChildren();
      let total = 0;
      let count = 0;

      cart.forEach(item => {
        total += item.price * item.quantity;
        count += item.quantity;

        const row = document.createElement("div");
        row.className = "cart-row";

        const name = document.createElement("span");
        name.textContent = `${item.emoji} ${item.name} × ${item.quantity}`;

        const price = document.createElement("strong");
        price.textContent = "₹" + (item.price * item.quantity).toLocaleString("en-IN");

        const remove = document.createElement("button");
        remove.className = "remove-btn";
        remove.textContent = "Remove";
        remove.addEventListener("click", () => {
          cart = cart.filter(product => product.id !== item.id);
          renderCart();
          messageEl.textContent = "";
        });

        row.append(name, price, remove);
        cartItemsEl.appendChild(row);
      });

      if (cart.length === 0) {
        cartItemsEl.textContent = "Your cart is empty. Add a product!";
      }

      totalEl.textContent = total.toLocaleString("en-IN");
      cartCountEl.textContent = count;
    }

    document.getElementById("sort").addEventListener("change", renderProducts);

    document.getElementById("checkout").addEventListener("click", () => {
      if (cart.length === 0) {
        messageEl.textContent = "Please add a product first.";
        return;
      }

      messageEl.textContent = "Demo order placed successfully! 🎉";
      cart = [];
      renderCart();
    });

    renderProducts();
    renderCart();
  </script>
</body>
</html>
