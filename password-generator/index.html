<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Generator | Sangeetha</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #141e30, #563a82);
      color: #25253a;
    }

    .app {
      width: 100%;
      max-width: 460px;
      padding: 28px;
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 20px 50px #0004;
    }

    h1 { margin: 0 0 8px; font-size: 26px; }
    .subtitle { color: #777; margin: 0 0 24px; }

    .password-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    #password {
      min-width: 0;
      flex: 1;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 15px;
    }

    button {
      padding: 12px 14px;
      border: 0;
      border-radius: 9px;
      color: white;
      background: #6547ce;
      font: inherit;
      cursor: pointer;
    }

    button:hover { opacity: .88; }

    .generate { width: 100%; margin: 18px 0; }

    .length-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    input[type="range"] { width: 100%; accent-color: #6547ce; }

    .options {
      display: grid;
      gap: 14px;
      margin-top: 22px;
    }

    .options label { display: flex; gap: 10px; align-items: center; }
    .options input { accent-color: #6547ce; }

    #strength {
      font-weight: bold;
      margin: 18px 0 0;
    }

    #message {
      min-height: 18px;
      color: #23834b;
      font-size: 14px;
    }

    @media (max-width: 380px) {
      .app { padding: 20px; }
      .password-row { flex-wrap: wrap; }
      #password { flex-basis: 100%; }
    }
  </style>
</head>
<body>
  <main class="app">
    <h1>🔐 Password Generator</h1>
    <p class="subtitle">Create a strong, random password.</p>

    <div class="password-row">
      <input id="password" type="text"
             placeholder="Your password appears here"
             readonly aria-label="Generated password">
      <button type="button" id="copy">Copy</button>
    </div>

    <div class="length-row">
      <label for="length">Password length</label>
      <strong id="lengthValue">16</strong>
    </div>

    <input id="length" type="range" min="8" max="32" value="16">

    <div class="options">
      <label><input id="uppercase" type="checkbox" checked> Uppercase letters (A–Z)</label>
      <label><input id="lowercase" type="checkbox" checked> Lowercase letters (a–z)</label>
      <label><input id="numbers" type="checkbox" checked> Numbers (0–9)</label>
      <label><input id="symbols" type="checkbox" checked> Symbols (!@#$...)</label>
    </div>

    <button type="button" class="generate" id="generate">
      Generate Password
    </button>

    <p id="strength">Strength: —</p>
    <p id="message" aria-live="polite"></p>
  </main>

  <script>
    const passwordOutput = document.getElementById("password");
    const lengthInput = document.getElementById("length");
    const lengthValue = document.getElementById("lengthValue");
    const message = document.getElementById("message");
    const strength = document.getElementById("strength");

    function secureRandom(max) {
      const values = new Uint32Array(1);
      const limit = Math.floor(4294967296 / max) * max;

      do {
        crypto.getRandomValues(values);
      } while (values[0] >= limit);

      return values[0] % max;
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = secureRandom(i + 1);
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function generatePassword() {
      const groups = [];

      if (document.getElementById("uppercase").checked)
        groups.push("ABCDEFGHIJKLMNOPQRSTUVWXYZ");
      if (document.getElementById("lowercase").checked)
        groups.push("abcdefghijklmnopqrstuvwxyz");
      if (document.getElementById("numbers").checked)
        groups.push("0123456789");
      if (document.getElementById("symbols").checked)
        groups.push("!@#$%^&*()-_=+[]{}?");

      if (groups.length === 0) {
        passwordOutput.value = "";
        strength.textContent = "Strength: —";
        message.textContent = "Select at least one character option.";
        return;
      }

      const allCharacters = groups.join("");
      const length = Number(lengthInput.value);
      const result = groups.map(group => group[secureRandom(group.length)]);

      while (result.length < length) {
        result.push(allCharacters[secureRandom(allCharacters.length)]);
      }

      passwordOutput.value = shuffle(result).join("");
      message.textContent = "";

      let score = groups.length;
      if (length >= 12) score++;
      if (length >= 16) score++;

      const label = score >= 5 ? "Very strong 💪"
                  : score >= 4 ? "Strong ✅"
                  : score >= 3 ? "Medium ⚠️"
                  : "Basic ⚠️";

      strength.textContent = "Strength: " + label;
    }

    lengthInput.addEventListener("input", () => {
      lengthValue.textContent = lengthInput.value;
    });

    document.getElementById("generate").addEventListener("click", generatePassword);

    document.getElementById("copy").addEventListener("click", async () => {
      if (!passwordOutput.value) {
        message.textContent = "Generate a password first.";
        return;
      }

      try {
        await navigator.clipboard.writeText(passwordOutput.value);
        message.textContent = "Password copied!";
      } catch {
        passwordOutput.select();
        const copied = document.execCommand("copy");
        message.textContent = copied
          ? "Password copied!"
          : "Copy failed. Please select and copy manually.";
      }
    });

    generatePassword();
  </script>
</body>
</html>
